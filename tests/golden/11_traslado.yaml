nombre: Sin traslado es cero, no ausente
descripcion: >
  El cliente compara travelTo contra el valor del chip, asi que null hacia que
  ni siquiera "Sin traslado" apareciera seleccionado.

turnos:
  - usuario: clase de quimica el jueves de 9 a 11, no tengo que viajar
    guion:
      - tools:
          - nombre: actualizar_borrador
            argumentos:
              name: Quimica
              activity_type: clase
              is_fixed: true
              travel_to: 0
              travel_from: 0
              schedule: [{day: Jueves, start_time: 540, end_time: 660}]
      - tools:
          - nombre: proponer_actividad
            argumentos: {}
    espera:
      tipo: propuesta
      propuesta: crear
      # No se exige travel_to: 0. El chip de "Sin traslado" del cliente dejo
      # de depender de eso en la Fase 0, y forzarlo aca mediria un detalle
      # que ya no le cambia nada al usuario.
      draft: {name: Quimica}
