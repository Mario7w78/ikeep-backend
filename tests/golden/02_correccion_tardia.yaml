nombre: Una correccion tardia no borra el resto
descripcion: >
  El usuario cambia la hora despues de haberla dado. Debe cambiar solo eso: la
  duracion y el nombre siguen siendo los mismos.

turnos:
  - usuario: tarea de estadistica, dos horas, el lunes de 14 a 16
    guion:
      - tools:
          - nombre: actualizar_borrador
            argumentos:
              name: Estadistica
              activity_type: tarea
              is_fixed: true
              duracion_minutos: 120
              schedule: [{day: Lunes, start_time: 840, end_time: 960}]
      - tools:
          - nombre: proponer_actividad
            argumentos: {}
    espera:
      # Propone de una: el usuario dio todo en un mensaje y preguntarle
      # "la agrego?" seria un turno desperdiciado.
      tipo: propuesta
      propuesta: crear
      draft: {name: Estadistica, duracion_minutos: 120}

  - usuario: mejor de 15 a 17
    guion:
      - tools:
          - nombre: actualizar_borrador
            argumentos:
              schedule: [{day: Lunes, start_time: 900, end_time: 1020}]
      - tools:
          - nombre: proponer_actividad
            argumentos: {}
    espera:
      tipo: propuesta
      propuesta: crear
      draft: {duracion_minutos: 120, name: Estadistica}
      draft_conserva: [name, activity_type, duracion_minutos]
